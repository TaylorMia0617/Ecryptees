        .container {
            background: var(--md-surface);
            border-radius: 16px;
            padding: 20px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            opacity: 0.95;
        }

        h1 {
            color: var(--md-primary);
            text-align: center;
            margin-bottom: 30px;
        }

        [hidden] {
            display: none !important;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            width: fit-content;
            margin: -10px auto 24px;
            padding: 4px;
            border-radius: 28px;
            background: var(--md-background);
        }

        .tab {
            min-width: 96px;
            padding: 10px 28px;
            color: #c2185b;
            background: transparent;
            box-shadow: none;
        }

        .tab:hover {
            color: #880e4f;
            background: #f8bbd0;
            transform: none;
        }

        .tab[aria-selected="true"] {
            color: var(--md-on-primary);
            background: var(--md-primary);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.18);
        }

        .tab:focus-visible,
        button:focus-visible,
        .file-picker:focus-visible,
        .download-button:focus-visible,
        textarea:focus-visible,
        input:focus-visible {
            outline: 3px solid rgba(63, 81, 181, 0.45);
            outline-offset: 2px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 12px;
            resize: vertical;
            margin: 10px 0;
            font-size: 1rem;
            background-color: #fff9fb;
        }

        .field-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .copy-button {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 50%;
            box-shadow: 0 3px 7px rgba(0, 0, 0, 0.18);
        }

        .copy-button:hover {
            transform: scale(1.06);
        }

        .copy-button:disabled:hover {
            background-color: var(--md-primary);
            transform: none;
        }

        .copy-button[data-copied="true"] {
            background-color: #2e7d32;
        }

        .copy-button[data-copied="true"]::after {
            position: absolute;
            right: 48px;
            content: attr(data-feedback);
            padding: 5px 9px;
            border-radius: 8px;
            color: #ffffff;
            background: rgba(33, 33, 33, 0.9);
            font-size: 0.78rem;
            font-weight: 500;
            line-height: 1;
            white-space: nowrap;
            pointer-events: none;
        }

        .copy-icon {
            display: block;
            width: 20px;
            height: 20px;
            filter: invert(1);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .button-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0;
        }

        button {
            background-color: var(--md-primary);
            color: var(--md-on-primary);
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 24px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background-color: #c2185b;
            transform: scale(1.05);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
            transform: none;
        }

        label {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .image-upload {
            padding: 20px;
            border: 2px dashed #f8bbd0;
            border-radius: 12px;
            background: #fff9fb;
            text-align: center;
        }

        .file-input {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .file-picker,
        .download-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border: none;
            border-radius: 24px;
            color: var(--md-on-primary);
            background: var(--md-primary);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            font-size: 1rem;
            font-weight: normal;
            text-decoration: none;
            transition: background-color 0.3s, transform 0.2s;
        }

        .file-picker:hover,
        .download-button:hover {
            background: #c2185b;
            transform: scale(1.05);
        }

        .file-input:disabled + .file-picker,
        .download-button[aria-disabled="true"] {
            pointer-events: none;
            opacity: 0.5;
            transform: none;
        }

        .hint {
            margin: 12px 0 0;
            color: #616161;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .compression-panel {
            margin: 18px 0;
            padding: 14px;
            border: 1px solid #f3c0d2;
            border-radius: 12px;
            background: #fff9fb;
        }

        .compression-title {
            display: block;
            margin-bottom: 10px;
        }

        .compression-options {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
        }

        .compression-option {
            display: flex;
            align-items: center;
            gap: 7px;
            min-width: 0;
            padding: 10px 12px;
            border: 1px solid #f3c0d2;
            border-radius: 10px;
            background: #ffffff;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .compression-option:has(input:checked) {
            border-color: var(--md-primary);
            color: #ad1457;
            background: #fce4ec;
            box-shadow: inset 0 0 0 1px var(--md-primary);
        }

        .compression-option input,
        .animation-option input {
            accent-color: var(--md-primary);
        }

        .compression-detail {
            margin: 10px 0 0;
            color: #616161;
            font-size: 0.86rem;
            line-height: 1.5;
        }

        .animation-option {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #f3c0d2;
            font-size: 0.9rem;
            font-weight: 500;
            line-height: 1.45;
        }

        .image-card {
            margin: 18px 0;
            padding: 14px;
            border: 1px solid #f3c0d2;
            border-radius: 12px;
            background: #fff9fb;
        }

        .image-card-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .image-meta {
            min-width: 0;
            color: #616161;
            font-size: 0.86rem;
            overflow-wrap: anywhere;
            text-align: right;
        }

        .image-preview {
            display: block;
            width: auto;
            max-width: 100%;
            max-height: 280px;
            height: auto;
            margin: 0 auto;
            border-radius: 8px;
            object-fit: contain;
            background: #ffffff;
        }

        .cipher-file-card {
            margin-top: 18px;
        }

        .cipher-file-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        .image-actions {
            margin-bottom: 12px;
        }

        .image-status {
            min-height: 24px;
            margin: 4px 0 0;
            color: #616161;
            text-align: center;
            line-height: 1.5;
        }

        .image-status[data-kind="success"] {
            color: #2e7d32;
        }

        .image-status[data-kind="error"] {
            color: var(--md-error);
            font-weight: bold;
        }

        .image-progress {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 48px;
            align-items: center;
            gap: 10px;
            margin: 10px 0 4px;
        }

        .image-progress progress {
            width: 100%;
            height: 12px;
            overflow: hidden;
            appearance: none;
            border: 0;
            border-radius: 999px;
            background: #f8bbd0;
        }

        .image-progress progress::-webkit-progress-bar {
            border-radius: 999px;
            background: #f8bbd0;
        }

        .image-progress progress::-webkit-progress-value {
            border-radius: 999px;
            background: var(--md-primary);
            transition: width 0.12s linear;
        }

        .image-progress progress::-moz-progress-bar {
            border-radius: 999px;
            background: var(--md-primary);
        }

        .image-progress[data-kind="success"] progress::-webkit-progress-value {
            background: #2e7d32;
        }

        .image-progress[data-kind="success"] progress::-moz-progress-bar {
            background: #2e7d32;
        }

        .image-progress span {
            color: #616161;
            font-variant-numeric: tabular-nums;
            text-align: right;
        }

        .download-row {
            display: flex;
            justify-content: center;
            margin-top: 14px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            .tabs {
                width: 100%;
            }

            .tab {
                flex: 1;
                min-width: 0;
                padding-inline: 16px;
            }

            .compression-options {
                grid-template-columns: 1fr;
            }

            .image-card-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 4px;
            }

            .image-meta {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>呃嗯！呼～❤呃啊～哼！！呃嗯哈嗯～啊</h1>

        <div class="tabs" role="tablist" aria-label="编解码类型">
            <button
                class="tab"
                id="textTab"
                type="button"
                role="tab"
                aria-selected="true"
                aria-controls="textPanel"
                tabindex="0"
                data-mode="text"
            >文本</button>
            <button
                class="tab"
                id="imageTab"
                type="button"
                role="tab"
                aria-selected="false"
                aria-controls="imagePanel"
                tabindex="-1"
                data-mode="image"
            >图片</button>
        </div>

        <section id="textPanel" role="tabpanel" aria-labelledby="textTab">
            <div class="section" aria-label="文本编解码">
                <label for="inputRaw">原文</label>
                <textarea id="inputRaw" placeholder="输入原文 (任意字符串)"></textarea>

                <div class="field-label-row">

            }

            for (let i = 0; i < input.length; i += 2) {

                const low = codebookCodeMap[input.charCodeAt(i + 1)];

                if (high === 0xFF || low === 0xFF) {
                    throw new CipherError('ILLEGAL_CHARACTER', '输入包含非法字符');
                }

                bytes[i / 2] = (high << 4) | low;
            }

            return bytes;

                const finish = () => {

                        return;
                    }

                    settled = true;
                    window.clearTimeout(fallbackTimer);
                    resolve();
                };
                const fallbackTimer = window.setTimeout(finish, 50);

                if (typeof window.requestAnimationFrame === 'function') {
                    window.requestAnimationFrame(() => window.setTimeout(finish, 0));
                }
            });

        async function encodeImageByteSegmentsChunked(segments, onProgress) {
            const totalBytes = segments.reduce((total, bytes) => total + bytes.length, 0);
            const chunks = [];
            let processedBytes = 0;
            let lastProgress = -1;

            if (totalBytes === 0) {
                onProgress(100);
                return '';
            }

            for (const bytes of segments) {
                for (let offset = 0; offset < bytes.length; offset += IMAGE_WORK_CHUNK_BYTES) {
                    const end = Math.min(offset + IMAGE_WORK_CHUNK_BYTES, bytes.length);
                    const utf16Bytes = new Uint8Array((end - offset) * 2);
                    let outputIndex = 0;

                    for (let i = offset; i < end; i++) {
                        const codeUnit = imageCodebookCodeUnits[bytes[i]];
                        utf16Bytes[outputIndex++] = codeUnit & 0xFF;
                        utf16Bytes[outputIndex++] = codeUnit >>> 8;
                    }

                    chunks.push(utf16Decoder.decode(utf16Bytes));
                    processedBytes += end - offset;
                    const progress = Math.max(1, Math.round((processedBytes / totalBytes) * 100));

                    if (progress !== lastProgress) {
                        lastProgress = progress;
                        onProgress(progress);
                    }

                    await waitForNextFrame();
                }
            }

            return chunks.join('');
        }

        async function decodeLegacyImageCodeChunked(input, onProgress) {

                return bytes;

                    const high = codebookCodeMap[input.charCodeAt(i)];
                    const low = codebookCodeMap[input.charCodeAt(i + 1)];

                    if (high === 0xFF || low === 0xFF) {
                        throw new CipherError('ILLEGAL_CHARACTER', '图片密文包含非法字符');
                    }

                    bytes[outputIndex++] = (high << 4) | low;
                }

                const progress = Math.max(1, Math.round((end / input.length) * 100));
                if (progress !== lastProgress) {
                    lastProgress = progress;
                    onProgress(progress);
                }
                await waitForNextFrame();
            }

            return bytes;
        }

        async function decodeCompactImageCodeChunked(input, onProgress) {
            const bytes = new Uint8Array(input.length);
            let lastProgress = -1;

            for (let offset = 0; offset < input.length; offset += IMAGE_WORK_CHUNK_BYTES) {
                const end = Math.min(offset + IMAGE_WORK_CHUNK_BYTES, input.length);

                for (let i = offset; i < end; i++) {
                    const byte = imageCodebookCodeMap[input.charCodeAt(i)];

                    if (byte === 0xFFFF) {
                        throw new CipherError('ILLEGAL_CHARACTER', '图片密文包含非法字符');
                    }

                    bytes[i] = byte;
                }

                const progress = Math.max(1, Math.round((end / input.length) * 100));
                if (progress !== lastProgress) {
                    lastProgress = progress;
                    onProgress(progress);
                }
                await waitForNextFrame();
            }

            return bytes;
        }

        async function decodeImageCodeChunked(input, onProgress) {
            if (input.startsWith(imageCodePrefix)) {
                return {
                    payload: await decodeCompactImageCodeChunked(input, onProgress),
                    cipherFamily: 'compact'
                };
            }

            if (input.startsWith(legacyImageCodePrefix)) {
                return {
                    payload: await decodeLegacyImageCodeChunked(input, onProgress),
                    cipherFamily: 'legacy'
                };
            }

        const crc32Table = (() => {
            const table = new Uint32Array(256);

            for (let i = 0; i < 256; i++) {
                let value = i;

                for (let bit = 0; bit < 8; bit++) {
                    value = (value & 1) ? (0xEDB88320 ^ (value >>> 1)) : (value >>> 1);
                }

                table[i] = value >>> 0;
            }

            return table;

            let crc = 0xFFFFFFFF;

            for (let i = 0; i < bytes.length; i++) {
                crc = crc32Table[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
            }

            return (crc ^ 0xFFFFFFFF) >>> 0;
        }

        async function calculateCrc32Chunked(bytes, onProgress) {
            let crc = 0xFFFFFFFF;
            let lastProgress = -1;

            if (bytes.length === 0) {
                onProgress(100);
                return 0;
            }

            for (let offset = 0; offset < bytes.length; offset += IMAGE_WORK_CHUNK_BYTES) {
                const end = Math.min(offset + IMAGE_WORK_CHUNK_BYTES, bytes.length);

                for (let i = offset; i < end; i++) {
                    crc = crc32Table[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
                }

                const progress = Math.max(1, Math.round((end / bytes.length) * 100));
                if (progress !== lastProgress) {
                    lastProgress = progress;
                    onProgress(progress);
                }
                await waitForNextFrame();
            }

            return (crc ^ 0xFFFFFFFF) >>> 0;

            }

            for (let i = 0; i < expected.length; i++) {

                    return false;
                }
            }

            return true;

            return value;

                return { mime: 'image/bmp', ...IMAGE_FORMATS['image/bmp'] };
            }

            let cursor = offset;

            while (cursor < bytes.length) {

                if (blockSize === 0) {

                }
                cursor += blockSize;
            }

            return bytes.length;

                return false;

            let cursor = 13;
            const globalColorTableFlag = (bytes[10] & 0x80) !== 0;
            if (globalColorTableFlag) {
                cursor += 3 * (1 << ((bytes[10] & 0x07) + 1));
            }

            let frameCount = 0;
            while (cursor < bytes.length) {
                const marker = bytes[cursor++];

                if (marker === 0x3B) {
                    break;
                }

                if (marker === 0x21) {
                    cursor += 1;
                    cursor = skipGifSubBlocks(bytes, cursor);
                    continue;
                }

                if (marker !== 0x2C || cursor + 9 > bytes.length) {
                    break;
                }

                frameCount++;
                if (frameCount > 1) {
                    return true;
                }

                const packed = bytes[cursor + 8];
                cursor += 9;
                if ((packed & 0x80) !== 0) {
                    cursor += 3 * (1 << ((packed & 0x07) + 1));
                }

                cursor += 1;
                cursor = skipGifSubBlocks(bytes, cursor);
            }

            return false;

            let cursor = 12;

            while (cursor + 8 <= bytes.length) {
                const chunkName = readAscii(bytes, cursor, 4);
                const chunkLength = bytes[cursor + 4]
                    | (bytes[cursor + 5] << 8)
                    | (bytes[cursor + 6] << 16)
                    | (bytes[cursor + 7] << 24);

                if (chunkName === 'ANIM' || chunkName === 'ANMF') {
                    return true;
                }

                cursor += 8 + (chunkLength >>> 0) + ((chunkLength >>> 0) & 1);
            }

            return false;
        }

            if (format.mime === 'image/gif') {
                return isAnimatedGif(bytes);
            }

            if (format.mime === 'image/webp') {
                return isAnimatedWebp(bytes);
            }

            if (format.mime === 'image/avif') {
                return readAscii(bytes, 8, Math.min(32, Math.max(0, bytes.length - 8))).includes('avis');

            return document.querySelector('input[name="compressionMode"]:checked')?.value || 'balanced';

            const baseName = String(name || 'image').replace(/\.[^.]*$/, '') || 'image';
            return `${baseName}-compressed.webp`;

            } catch (error) {

        function buildProcessedImage(image, bytes, options) {
            const format = options.format;
            const outputName = options.outputName;
            const metadata = {
                name: outputName,
                type: format.mime,
                size: bytes.length,
                source: {
                    name: image.file.name,
                    type: image.format.mime,
                    size: image.bytes.length,
                    width: options.sourceWidth || null,
                    height: options.sourceHeight || null,
                    animated: image.animated
                },
                compression: {
                    mode: options.mode,
                    codec: options.codec,
                    quality: options.quality === null ? null : Math.round(options.quality * 100),
                    width: options.width || null,
                    height: options.height || null,
                    animation: options.animation

                bytes,
                format,
                outputName,
                metadata,
                quality: options.quality,
                width: options.width,
                height: options.height,
                sourceWidth: options.sourceWidth,
                sourceHeight: options.sourceHeight,

                    format: image.format,
                    outputName: image.file.name,
                    mode,
                    codec: 'original',
                    quality: null,
                    width: null,
                    height: null,
                    sourceWidth: null,
                    sourceHeight: null,
                    animation: 'preserved'
                });
            }

            onProgress({ percent: 5, message: '正在解码图片像素' });
            const bitmap = await createBitmapFromFile(image.file);
            const sourceWidth = bitmap.width;
            const sourceHeight = bitmap.height;

            if (!sourceWidth || !sourceHeight || sourceWidth * sourceHeight > MAX_IMAGE_PIXELS) {
                bitmap.close?.();
                throw new Error('图片像素不能超过 4000 万');
            }

            const initialScale = Math.min(1, preset.maxEdge / Math.max(sourceWidth, sourceHeight));
            let width = Math.max(1, Math.round(sourceWidth * initialScale));
            let height = Math.max(1, Math.round(sourceHeight * initialScale));
            let quality = preset.initialQuality;
            const targetBytes = Math.min(
                preset.targetBytes,
                Math.max(32 * 1024, Math.round(image.bytes.length * preset.targetRatio))
            );
            const totalPasses = 5;
            let best = buildProcessedImage(image, image.bytes, {
                format: image.format,
                outputName: image.file.name,
                mode,
                codec: 'original',
                quality: null,
                width: sourceWidth,
                height: sourceHeight,
                sourceWidth,
                sourceHeight,
                animation: image.animated ? 'preserved' : 'none'
            });
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d', { alpha: true });

            if (!context) {
                bitmap.close?.();
                throw new Error('当前浏览器无法创建图片压缩画布');
            }

            try {
                for (let pass = 1; pass <= totalPasses; pass++) {
                    canvas.width = width;
                    canvas.height = height;
                    context.clearRect(0, 0, width, height);
                    context.drawImage(bitmap, 0, 0, width, height);
                    await waitForNextFrame();

                    const blob = await canvasToWebp(canvas, quality);
                    const candidateBytes = new Uint8Array(await blob.arrayBuffer());

                    if (candidateBytes.length < best.bytes.length) {
                        best = buildProcessedImage(image, candidateBytes, {
                            format: { mime: 'image/webp', ...IMAGE_FORMATS['image/webp'] },
                            outputName: makeCompressedName(image.file.name),
                            mode,
                            codec: 'webp',
                            quality,
                            width,
                            height,
                            sourceWidth,
                            sourceHeight,
                            animation: image.animated ? 'first-frame' : 'none'
                        });
                    }

                    const percent = Math.round((pass / totalPasses) * 95);
                    onProgress({
                        percent,
                        message: `第 ${pass}/${totalPasses} 轮：${width}×${height}，质量 ${Math.round(quality * 100)}%，${formatBytes(candidateBytes.length)}`
                    });

                    if (candidateBytes.length <= targetBytes) {
                        break;
                    }

                    if (quality - 0.08 >= preset.minimumQuality) {
                        quality = Math.max(preset.minimumQuality, quality - 0.08);
                    } else {
                        width = Math.max(1, Math.round(width * 0.84));
                        height = Math.max(1, Math.round(height * 0.84));
                        quality = Math.min(preset.initialQuality, preset.minimumQuality + 0.08);
                    }
                }
            } finally {
                context.clearRect(0, 0, canvas.width, canvas.height);
                canvas.width = 1;
                canvas.height = 1;
                bitmap.close?.();
            }

            onProgress({ percent: 100, message: best.usedOriginal ? '原文件已经更小，直接采用原文件' : '图片压缩完成' });
            return best;
        }

        function buildImagePrefix(image, imageCrc32) {
            const metadataBytes = new TextEncoder().encode(JSON.stringify(image.metadata || {
                name: image.file.name,
                type: image.format.mime,
                size: image.bytes.length
            }));

            if (metadataBytes.length > MAX_METADATA_BYTES) {
                throw new Error('图片文件名过长，无法写入密文');
            }

            const prefix = new Uint8Array(IMAGE_HEADER_SIZE + metadataBytes.length);
            const view = new DataView(prefix.buffer);
            prefix.set(IMAGE_MAGIC, 0);
            prefix[8] = IMAGE_VERSION;
            view.setUint32(9, metadataBytes.length, false);
            view.setUint32(13, image.bytes.length, false);
            view.setUint32(17, imageCrc32, false);
            prefix.set(metadataBytes, IMAGE_HEADER_SIZE);
            return prefix;
        }

        function buildImagePayload(image) {
            const prefix = buildImagePrefix(image, calculateCrc32(image.bytes));
            const payload = new Uint8Array(prefix.length + image.bytes.length);
            payload.set(prefix, 0);
            payload.set(image.bytes, prefix.length);
            return payload;
        }

        function parseImagePayload(payload) {
            if (payload.length < IMAGE_HEADER_SIZE || !matchesBytes(payload, 0, IMAGE_MAGIC)) {
                throw new Error('这不是有效的图片密文');
            }

            if (payload[8] !== LEGACY_IMAGE_VERSION
                && payload[8] !== COMPACT_IMAGE_VERSION
                && payload[8] !== IMAGE_VERSION) {
                throw new Error(`不支持的图片密文版本：${payload[8]}`);
            }

            const view = new DataView(payload.buffer, payload.byteOffset, payload.byteLength);
            const metadataLength = view.getUint32(9, false);
            const imageLength = view.getUint32(13, false);
            const expectedCrc32 = view.getUint32(17, false);

            if (metadataLength === 0 || metadataLength > MAX_METADATA_BYTES) {
                throw new Error('图片密文的文件信息无效');
            }

            if (imageLength === 0 || imageLength > MAX_IMAGE_BYTES) {
                throw new Error('图片密文中的图片大小无效或超过 15 MiB');
            }

            const expectedLength = IMAGE_HEADER_SIZE + metadataLength + imageLength;
            if (payload.length !== expectedLength) {
                throw new Error('图片密文长度不完整');
            }

            const metadataBytes = payload.subarray(IMAGE_HEADER_SIZE, IMAGE_HEADER_SIZE + metadataLength);
            const imageBytes = payload.slice(IMAGE_HEADER_SIZE + metadataLength);
            let metadata;

            try {
                metadata = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(metadataBytes));
            } catch (error) {
                throw new Error('图片密文的文件信息已损坏');
            }

            if (!metadata || typeof metadata.name !== 'string' || typeof metadata.type !== 'string' || metadata.size !== imageLength) {
                throw new Error('图片密文的文件信息无效');
            }

            const format = sniffImageType(imageBytes);
            if (!format || !IMAGE_FORMATS[format.mime]) {
                throw new Error('图片密文中不是受支持的图片格式');
            }

            if (metadata.type !== format.mime) {
                throw new Error('图片密文的格式信息与图片内容不一致');
            }

            if (calculateCrc32(imageBytes) !== expectedCrc32) {
                throw new Error('图片密文校验失败，内容可能已损坏');
            }

            return { metadata, imageBytes, format };
        }

        function formatBytes(byteCount) {
            if (byteCount < 1024) {
                return `${byteCount} B`;
            }

            if (byteCount < 1024 * 1024) {
                return `${(byteCount / 1024).toFixed(1)} KiB`;
            }

            return `${(byteCount / (1024 * 1024)).toFixed(2)} MiB`;
        }

        function sanitizeDownloadName(name, extension) {
            const sanitized = Array.from(String(name || '')
                .replace(/[\\/:*?"<>|\u0000-\u001F\u007F]/g, '_')
                .trim())
                .slice(0, 180)
                .join('');

            return sanitized || `decoded-image.${extension}`;
        }

        function setImageStatus(message, kind = 'info') {
            const status = document.getElementById('imageStatus');
            status.textContent = message;
            status.dataset.kind = kind;
            status.setAttribute('role', kind === 'error' ? 'alert' : 'status');
        }

        function setImageProgress(value, kind = 'info') {
            const normalizedValue = Math.max(0, Math.min(100, Math.round(value)));
            const group = document.getElementById('imageProgressGroup');
            const progress = document.getElementById('imageProgress');
            group.hidden = false;
            group.dataset.kind = kind;
            progress.value = normalizedValue;
            progress.setAttribute('aria-valuetext', `${normalizedValue}%`);
            document.getElementById('imageProgressText').textContent = `${normalizedValue}%`;
        }

        function resetImageProgress() {
            const group = document.getElementById('imageProgressGroup');
            group.hidden = true;
            group.dataset.kind = 'info';
            document.getElementById('imageProgress').value = 0;
            document.getElementById('imageProgressText').textContent = '0%';
        }

        function clearCompressedPreview() {
            if (compressedImageUrl) {
                URL.revokeObjectURL(compressedImageUrl);
                compressedImageUrl = '';
            }

            document.getElementById('compressedImagePreview').removeAttribute('src');
            document.getElementById('compressedImageCard').hidden = true;
            document.getElementById('compressedImageMeta').textContent = '';
        }

        function showCompressedPreview(result) {
            clearCompressedPreview();
            const blob = new Blob([result.bytes], { type: result.format.mime });
            compressedImageUrl = URL.createObjectURL(blob);
            document.getElementById('compressedImagePreview').src = compressedImageUrl;

            const reduction = selectedImage
                ? Math.max(0, (1 - result.bytes.length / selectedImage.bytes.length) * 100)
                : 0;
            const dimensions = result.width && result.height ? ` · ${result.width}×${result.height}` : '';
            const quality = result.quality === null ? '' : ` · 质量 ${Math.round(result.quality * 100)}%`;
            document.getElementById('compressedImageMeta').textContent = `${result.outputName} · ${formatBytes(result.bytes.length)}${dimensions}${quality} · 缩减 ${reduction.toFixed(1)}%`;
            document.getElementById('compressedImageCard').hidden = false;
        }

        function clearCipherTextDownload() {
            if (cipherTextDownloadUrl) {
                URL.revokeObjectURL(cipherTextDownloadUrl);
                cipherTextDownloadUrl = '';
            }

            const download = document.getElementById('downloadCipherText');
            download.href = '#';
            download.removeAttribute('download');
            download.setAttribute('aria-disabled', 'true');
        }

        function createCipherTextDownload(encoded, sourceName) {
            clearCipherTextDownload();
            const baseName = String(sourceName || 'image').replace(/\.[^.]*$/, '') || 'image';
            const fileName = sanitizeDownloadName(`${baseName}-msbt-v3.txt`, 'txt');
            const blob = new Blob([encoded], { type: 'text/plain;charset=utf-8' });
            cipherTextDownloadUrl = URL.createObjectURL(blob);
            const download = document.getElementById('downloadCipherText');
            download.href = cipherTextDownloadUrl;
            download.download = fileName;
            download.setAttribute('aria-disabled', 'false');
            return { fileName, byteLength: blob.size };
        }

        function invalidateImageCipherOutput(message = '') {
            clearCipherTextDownload();
            clearCompressedPreview();

            if (message && selectedImage) {
                setImageStatus(message);
            }

            updateImageButtons();
        }

        function updateImageButtons() {
            document.getElementById('encodeImageButton').disabled = imageBusy || !selectedImage;
            document.getElementById('decodeImageButton').disabled = imageBusy || importedImageCode.length === 0;
            document.getElementById('imageFile').disabled = imageBusy;
            document.getElementById('imageCodeFile').disabled = imageBusy;
            document.getElementById('compressionPanel').disabled = imageBusy;
            document.getElementById('downloadCipherText').setAttribute('aria-disabled', String(imageBusy || !cipherTextDownloadUrl));
        }

        function updateTextCopyButton(generated = false) {
            const button = document.getElementById('copyTextCodeButton');
            button.dataset.generated = generated && document.getElementById('inputCode').value.length > 0 ? 'true' : '';
            button.disabled = !button.dataset.generated;
        }

        async function copyCipherText(inputId, buttonId, label) {
            const input = document.getElementById(inputId);
            const button = document.getElementById(buttonId);

            if (button.disabled || !input.value) {
                return;
            }

            try {
                let copied = false;

                if (navigator.clipboard && window.isSecureContext) {
                    try {
                        await navigator.clipboard.writeText(input.value);
                        copied = true;
                    } catch (error) {
                        copied = false;
                    }
                }

                if (!copied) {
                    const selectionStart = input.selectionStart;
                    const selectionEnd = input.selectionEnd;
                    input.focus();
                    input.select();

                    if (!document.execCommand('copy')) {
                        throw new Error('复制失败');
                    }

                    input.setSelectionRange(selectionStart, selectionEnd);
                }

                button.dataset.copied = 'true';
                button.setAttribute('aria-label', `${label}已复制`);
                button.title = `${label}已复制`;
                document.getElementById('copyStatus').textContent = `${label}已复制`;
                window.clearTimeout(button._copyResetTimer);
                button._copyResetTimer = window.setTimeout(() => {
                    button.dataset.copied = 'false';
                    button.setAttribute('aria-label', `复制${label}`);
                    button.title = `复制${label}`;
                }, 1600);
            } catch (error) {
                alert('复制失败，请手动选择密文复制');
            }
        }

        function setImageBusy(busy) {
            imageBusy = busy;
            updateImageButtons();
        }

        function switchTab(mode, focusTab = false) {
            const isText = mode === 'text';
            const textTab = document.getElementById('textTab');
            const imageTab = document.getElementById('imageTab');
            const activeTab = isText ? textTab : imageTab;

            textTab.setAttribute('aria-selected', String(isText));
            textTab.tabIndex = isText ? 0 : -1;
            imageTab.setAttribute('aria-selected', String(!isText));
            imageTab.tabIndex = isText ? -1 : 0;
            document.getElementById('textPanel').hidden = !isText;
            document.getElementById('imagePanel').hidden = isText;

            if (focusTab) {
                activeTab.focus();
            }
        }

        async function handleImageSelection(event) {
            const file = event.target.files[0];

            if (!file) {
                return;
            }

            try {
                if (file.size === 0) {
                    throw new Error('图片文件不能为空');
                }

                if (file.size > MAX_IMAGE_BYTES) {
                    throw new Error('图片不能超过 15 MiB');
                }

                const bytes = new Uint8Array(await file.arrayBuffer());
                const format = sniffImageType(bytes);

                if (!format) {
                    throw new Error('不支持该图片格式，请选择 PNG、JPEG、GIF、WebP、BMP 或 AVIF');
                }

                const animated = isAnimatedImage(bytes, format);
                selectedImage = { file, bytes, format, animated };

                if (sourceImageUrl) {
                    URL.revokeObjectURL(sourceImageUrl);
                }

                sourceImageUrl = URL.createObjectURL(file);
                const preview = document.getElementById('sourceImagePreview');
                preview.onload = () => {
                    if (!selectedImage || selectedImage.file !== file) {
                        return;
                    }

                    selectedImage.width = preview.naturalWidth;
                    selectedImage.height = preview.naturalHeight;
                    const dimensions = preview.naturalWidth && preview.naturalHeight ? ` · ${preview.naturalWidth}×${preview.naturalHeight}` : '';
                    document.getElementById('sourceImageMeta').textContent = `${file.name} · ${format.label} · ${formatBytes(file.size)}${dimensions}${animated ? ' · 动画' : ''}`;
                };
                preview.src = sourceImageUrl;
                document.getElementById('sourceImageMeta').textContent = `${file.name} · ${format.label} · ${formatBytes(file.size)}${animated ? ' · 动画' : ''}`;
                document.getElementById('sourceImageCard').hidden = false;
                document.getElementById('animationOption').hidden = !animated;
                document.getElementById('flattenAnimation').checked = false;
                importedImageCode = '';
                document.getElementById('imageCodeFile').value = '';
                document.getElementById('imageCodeFileMeta').textContent = '尚未选择 TXT';
                clearCipherTextDownload();
                clearCompressedPreview();
                resetImageProgress();
                setImageStatus(animated
                    ? '检测到动画：默认保留全部帧；勾选“只保留首帧”后才能进行有损压缩。'
                    : '图片已准备好，将按所选档位压缩后编码。');
            } catch (error) {
                event.target.value = '';
                setImageStatus(error.message, 'error');
            } finally {
                updateImageButtons();
            }
        }

        async function handleCipherTextSelection(event) {
            const file = event.target.files[0];

            if (!file) {
                return;
            }

            importedImageCode = '';
            try {
                if (file.size === 0) {
                    throw new Error('密文 TXT 文件不能为空');
                }

                if (!/\.txt$/i.test(file.name)) {
                    throw new Error('请选择 TXT 密文文件');
                }

                if (file.size > MAX_CIPHER_TEXT_FILE_BYTES) {
                    throw new Error('密文 TXT 文件过大');
                }

                const input = (await file.text()).replace(/^\uFEFF/, '').trim();
                if (!input) {
                    throw new Error('密文 TXT 文件中没有内容');
                }

                const maximumCodeLength = input.startsWith(imageCodePrefix)
                    ? MAX_COMPACT_IMAGE_CODE_LENGTH
                    : MAX_IMAGE_CODE_LENGTH;
                if (input.length > maximumCodeLength) {
                    throw new Error('密文 TXT 内容过长，图片可能超过 15 MiB');
                }

                if (!input.startsWith(imageCodePrefix) && !input.startsWith(legacyImageCodePrefix)) {
                    throw new Error('这不是本工具生成的图片密文 TXT');
                }

                importedImageCode = input;
                document.getElementById('imageCodeFileMeta').textContent = `${file.name} · ${formatBytes(file.size)} · ${input.length.toLocaleString()} 字符`;
                resetImageProgress();
                setImageStatus('密文 TXT 已读取，可以开始解码。');
            } catch (error) {
                event.target.value = '';
                document.getElementById('imageCodeFileMeta').textContent = 'TXT 读取失败';
                setImageStatus(error.message || '密文 TXT 读取失败', 'error');
            } finally {
                updateImageButtons();
            }
        }

        function encode() {
            const input = document.getElementById('inputRaw').value;
            const bytes = new TextEncoder().encode(input);
            document.getElementById('inputCode').value = encodeBytes(bytes);
            updateTextCopyButton(true);
        }

        function decode() {
            const input = document.getElementById('inputCode').value;
            let bytes;

            try {
                bytes = decodeCode(input);
            } catch (error) {
                alert(error.message);
                return;
            }

            const decoder = new TextDecoder();

            try {
                document.getElementById('inputRaw').value = decoder.decode(bytes);
            } catch (error) {
                alert('无法正确解码为UTF-8文本');
                document.getElementById('inputRaw').value = Array.from(bytes)
                    .map(byte => byte.toString(16).padStart(2, '0'))
                    .join(' ');
            }
        }

        async function encodeImage() {
            if (imageBusy || !selectedImage) {
                return;
            }

            setImageBusy(true);
            clearCipherTextDownload();
            setImageProgress(0);
            setImageStatus('正在准备图片密文… 0%');
            await waitForNextFrame();

            try {
                const mode = getCompressionMode();
                const flattenAnimation = document.getElementById('flattenAnimation').checked;
                setImageProgress(8);
                setImageStatus('图片验证完成，正在准备压缩… 8%');
                const processedImage = await optimizeImage(selectedImage, mode, flattenAnimation, info => {
                    const overallProgress = 10 + Math.round(info.percent * 0.55);
                    setImageProgress(overallProgress);
                    setImageStatus(`${info.message}… ${overallProgress}%`);
                });
                const imageCrc32 = await calculateCrc32Chunked(processedImage.bytes, progress => {
                    const overallProgress = 65 + Math.round(progress * 0.1);
                    setImageProgress(overallProgress);
                    setImageStatus(`正在校验压缩结果… ${overallProgress}%`);
                });
                const prefix = buildImagePrefix(processedImage, imageCrc32);
                const encoded = await encodeImageByteSegmentsChunked([prefix, processedImage.bytes], progress => {
                    const overallProgress = 75 + Math.round(progress * 0.22);
                    setImageProgress(overallProgress);
                    setImageStatus(`正在编码图片… ${overallProgress}%`);
                });

                setImageProgress(98);
                setImageStatus('正在生成密文 TXT 文件… 98%');
                await waitForNextFrame();
                const textFile = createCipherTextDownload(encoded, selectedImage.file.name);
                showCompressedPreview(processedImage);
                setImageProgress(100, 'success');
                const reduction = Math.max(0, (1 - processedImage.bytes.length / selectedImage.bytes.length) * 100);
                const animationNote = processedImage.animation === 'preserved' ? '，动画已完整保留' : '';
                document.getElementById('imageCodeFileMeta').textContent = `${textFile.fileName} · ${formatBytes(textFile.byteLength)} · ${encoded.length.toLocaleString()} 字符`;
                setImageStatus(`编码完成：${formatBytes(selectedImage.bytes.length)} → ${formatBytes(processedImage.bytes.length)}，TXT 共 ${encoded.length.toLocaleString()} 个密文字符，图片缩减 ${reduction.toFixed(1)}%${animationNote}。请下载密文文件。`, 'success');
            } catch (error) {
                document.getElementById('imageProgressGroup').dataset.kind = 'error';
                setImageStatus(error.message || '图片编码失败', 'error');
            } finally {
                setImageBusy(false);
            }
        }

        async function decodeImage() {
            if (imageBusy) {
                return;
            }

            const input = importedImageCode;

            if (!input) {
                setImageStatus('请先选择图片密文 TXT 文件', 'error');
                return;
            }

            const maximumCodeLength = input.startsWith(imageCodePrefix)
                ? MAX_COMPACT_IMAGE_CODE_LENGTH
                : MAX_IMAGE_CODE_LENGTH;
            if (input.length > maximumCodeLength) {
                setImageStatus('图片密文过长，图片可能超过 15 MiB', 'error');
                return;
            }

            setImageBusy(true);
            setImageProgress(0);
            setImageStatus('正在读取图片密文… 0%');
            await waitForNextFrame();

            try {
                const decoded = await decodeImageCodeChunked(input, progress => {
                    const overallProgress = Math.min(95, Math.round(progress * 0.95));
                    setImageProgress(overallProgress);
                    setImageStatus(`正在解码图片… ${overallProgress}%`);
                });
                setImageProgress(97);
                setImageStatus('正在验证图片… 97%');
                await waitForNextFrame();
                const payloadVersion = decoded.payload[8];
                const familyMatches = decoded.cipherFamily === 'legacy'
                    ? payloadVersion === LEGACY_IMAGE_VERSION
                    : payloadVersion === COMPACT_IMAGE_VERSION || payloadVersion === IMAGE_VERSION;
                if (!familyMatches) {
                    throw new Error('图片密文版本与编码方式不一致');
                }
                const result = parseImagePayload(decoded.payload);
                const blob = new Blob([result.imageBytes], { type: result.format.mime });
                const nextUrl = URL.createObjectURL(blob);
                const downloadName = sanitizeDownloadName(result.metadata.name, result.format.extension);

                if (decodedImageUrl) {
                    URL.revokeObjectURL(decodedImageUrl);
                }

                decodedImageUrl = nextUrl;
                document.getElementById('decodedImagePreview').src = decodedImageUrl;
                const compression = result.metadata.compression;
                const compressionLabel = compression && typeof compression.mode === 'string'
                    ? ` · ${COMPRESSION_PRESETS[compression.mode]?.label || compression.mode}`
                    : '';
                document.getElementById('decodedImageMeta').textContent = `${downloadName} · ${result.format.label} · ${formatBytes(result.imageBytes.length)}${compressionLabel}`;
                const download = document.getElementById('downloadImage');
                download.href = decodedImageUrl;
                download.download = downloadName;
                document.getElementById('decodedImageCard').hidden = false;
                setImageProgress(100, 'success');
                setImageStatus('图片解码成功，可以预览或下载。', 'success');
            } catch (error) {
                document.getElementById('imageProgressGroup').dataset.kind = 'error';
                setImageStatus(error.message || '图片解码失败', 'error');
            } finally {
                setImageBusy(false);
            }
        }

        const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
        tabs.forEach((tab, index) => {
            tab.addEventListener('click', () => switchTab(tab.dataset.mode));
            tab.addEventListener('keydown', event => {
                let targetIndex = null;

                if (event.key === 'ArrowRight') {
                    targetIndex = (index + 1) % tabs.length;
                } else if (event.key === 'ArrowLeft') {
                    targetIndex = (index - 1 + tabs.length) % tabs.length;
                } else if (event.key === 'Home') {
                    targetIndex = 0;
                } else if (event.key === 'End') {
                    targetIndex = tabs.length - 1;
                }

                if (targetIndex !== null) {
                    event.preventDefault();
                    switchTab(tabs[targetIndex].dataset.mode, true);
                }
            });
        });

        const imageFileInput = document.getElementById('imageFile');
        imageFileInput.addEventListener('change', handleImageSelection);
        document.querySelector('.file-picker').addEventListener('keydown', event => {
            if ((event.key === 'Enter' || event.key === ' ') && !imageFileInput.disabled) {
                event.preventDefault();
                imageFileInput.click();
            }
        });

        document.querySelectorAll('input[name="compressionMode"]').forEach(input => {
            input.addEventListener('change', () => {
                const preset = COMPRESSION_PRESETS[getCompressionMode()];
                document.getElementById('compressionDetail').textContent = preset.description;
                invalidateImageCipherOutput('压缩档位已改变，请重新编码图片。');
            });
        });
        document.getElementById('flattenAnimation').addEventListener('change', () => {
            invalidateImageCipherOutput(document.getElementById('flattenAnimation').checked
                ? '将只保留动画首帧并进行有损压缩。'
                : '将保留全部动画帧，不进行有损转码。');
        });

        const imageCodeFileInput = document.getElementById('imageCodeFile');
        imageCodeFileInput.addEventListener('change', handleCipherTextSelection);
        document.getElementById('imageCodeFilePicker').addEventListener('keydown', event => {
            if ((event.key === 'Enter' || event.key === ' ') && !imageCodeFileInput.disabled) {
                event.preventDefault();
                imageCodeFileInput.click();
            }
        });
        document.getElementById('inputCode').addEventListener('input', () => updateTextCopyButton(false));
        window.addEventListener('beforeunload', () => {
            if (sourceImageUrl) {
                URL.revokeObjectURL(sourceImageUrl);
            }
            if (compressedImageUrl) {
                URL.revokeObjectURL(compressedImageUrl);
            }
            if (cipherTextDownloadUrl) {
                URL.revokeObjectURL(cipherTextDownloadUrl);
            }
            if (decodedImageUrl) {
                URL.revokeObjectURL(decodedImageUrl);
            }
        });

        updateImageButtons();
    </script>
</body>
</html>
