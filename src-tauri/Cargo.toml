[package]
name = "ecryptees-desktop"
version = "1.1.4"
description = "Offline Ecryptees Windows desktop application"
authors = ["Ecryptees"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "ecryptees_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = { version = "2", features = ["protocol-asset"] }
trash = "5"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true

[profile.dev]
debug = 0
incremental = false
